name: iosApp
options:
  bundleIdPrefix: io.github.milanhorvatovic.reducible.cookbook
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.milanhorvatovic.reducible.cookbook.ios
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
    preBuildScripts:
      - name: Build Shared Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home 2>/dev/null || echo "/Applications/Android Studio.app/Contents/jbr/Contents/Home")
          fi
          cd "$SRCROOT/../../.."
          ./gradlew :examples:cookbook:shared:embedAndSignAppleFrameworkForXcode
