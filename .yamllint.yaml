# yamllint checks the YAML files (workflows, Dependabot); actionlint checks
# what the workflows mean. No line-length cap, for the same reason prose is not
# hard-wrapped; `---` document starts are not required of single-document files.
extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
    require-starting-space: true
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  key-duplicates:
    level: error
