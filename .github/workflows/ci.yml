name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Formatters and linters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ktlint hook that checks the Gradle scripts runs on a JVM.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` installs exactly what package-lock.json pins, the same
      # prettier and markdownlint the local hooks run.
      - run: npm ci
      - name: Run every hook over the whole tree
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # macOS-only tools; the ios job runs them.
          SKIP: swiftformat,swiftlint

  check:
    name: JVM tests, lint, API check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build, test on the JVM host, lint, and check the API dumps
        run: ./gradlew build -PskipIosTests

  ios:
    name: iOS tests and framework
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # The runner image ships SwiftFormat and SwiftLint; the versions are
      # printed so a drift from the local ones is visible in the log.
      - name: Check Swift formatting and lint
        run: |
          swiftformat --version
          swiftlint version
          swiftformat --lint --config .swiftformat swift examples/cookbook/iosApp/iosApp
          swiftlint lint --strict
      - name: Run the simulator tests of the library modules
        run: ./gradlew iosSimulatorArm64Test
      - name: Link the Cookbook framework
        run: ./gradlew :examples:cookbook:shared:linkDebugFrameworkIosSimulatorArm64
      - name: Build the Cookbook iOS app
        run: >
          xcodebuild
          -project examples/cookbook/iosApp/iosApp.xcodeproj
          -target iosApp
          -sdk iphonesimulator
          -configuration Debug
          -arch arm64
          CODE_SIGNING_ALLOWED=NO
          build
